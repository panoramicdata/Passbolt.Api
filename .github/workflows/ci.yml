name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Pack
      run: |
        dotnet pack Passbolt.Api/Passbolt.Api.csproj --no-build --configuration Release --output ./artifacts
        dotnet pack Passbolt.Cli/Passbolt.Cli.csproj --no-build --configuration Release --output ./artifacts

    - name: Upload NuGet artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
        retention-days: 1

  # Uploads test coverage to Codacy (OPS-157454). Runs on our own pdl-public runners, never
  # GitHub-hosted ones. Only tests that need no credentials run here: the Integration classes call
  # a live Passbolt server with credentials from user secrets, which CI does not have, and
  # xunit.runner.json's failSkips would turn their skips into failures.
  coverage:
    runs-on: [pdl-public]

    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      # The actions-runner image does not offer the Node version several of these
      # actions request by default; without this they fail before their first step.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Nerdbank.GitVersioning needs the full history.

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      env:
        # The runner user cannot write /usr/share/dotnet, the default install location.
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: '10.0.x'

    - name: Build tests
      run: dotnet build Passbolt.Api.Test/Passbolt.Api.Test.csproj --configuration Debug

    # The test project is a Microsoft.Testing.Platform application
    # (UseMicrosoftTestingPlatformRunner), so coverage is collected by running the test
    # executable directly with Microsoft.Testing.Extensions.CodeCoverage rather than through
    # `dotnet test`. On Linux the executable has no .exe extension. coverage.config ports
    # coverlet's generated-code exclusions so figures stay comparable across the estate.
    - name: Run tests with coverage
      run: >-
        ./Passbolt.Api.Test/bin/Debug/net10.0/Passbolt.Api.Test
        --coverage
        --coverage-settings coverage.config
        --coverage-output-format cobertura
        --coverage-output coverage.cobertura.xml
        --filter "Category!=Integration"

    # continue-on-error: a Codacy outage must not turn a passing test run red. The trade-off is
    # that an expired or missing project token fails silently, so check the step log for
    # "Coverage received successfully".
    - name: Upload coverage to Codacy
      continue-on-error: true
      uses: codacy/codacy-coverage-reporter-action@v1
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: Passbolt.Api.Test/bin/Debug/net10.0/TestResults/coverage.cobertura.xml

    - name: Upload coverage artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: Passbolt.Api.Test/bin/Debug/net10.0/TestResults/coverage.cobertura.xml
        retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: nuget
        path: ./artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: NuGet Login (Trusted Publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: david_n_m_bond

    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
